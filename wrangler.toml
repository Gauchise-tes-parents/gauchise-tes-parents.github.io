# Backend IA de « Gauchise tes parents » sur Cloudflare Workers (déployé automatiquement par Cloudflare à chaque
# modification de la branche main, ou à la main avec « npx wrangler deploy » depuis la racine du dépôt).
# Guide : worker/README.md. La clé n'est JAMAIS écrite ici : elle est un secret (GEMINI_API_KEY) dans Cloudflare.
# Le nom doit être identique à celui du Worker créé dans le tableau de bord Cloudflare.
name = "gauchise-tes-parents-github-io"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Garder les variables saisies dans le tableau de bord Cloudflare à chaque déploiement automatique
# (sans cela, une clé enregistrée comme simple « variable » serait effacée ; il faut l'enregistrer comme « Secret »).
keep_vars = true

# Avant chaque déploiement : intégrer la bibliothèque vérifiée au Worker (worker/src/kb.json)
[build]
command = "node scripts/build-worker-kb.js"

[vars]
# Modèle Gemini : à changer ici sans toucher au code (liste à jour : https://ai.google.dev/gemini-api/docs/models)
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Recherche Google (« grounding ») pour les réponses directes : "1" activée, "0" désactivée.
# Coupée par défaut pour réserver le quota de recherche aux fiches (la création de fiche cherche toujours).
GEMINI_RECHERCHE = "0"
# Modèles de secours (séparés par des virgules), essayés seulement si le modèle principal est refusé (quota, modèle absent)
GEMINI_MODELES_SECOURS = "gemini-2.5-flash-lite"
GEMINI_TIMEOUT_MS = "45000"
# Seuls ces sites peuvent appeler le backend depuis un navigateur (séparés par des virgules)
ALLOWED_ORIGINS = "https://gauchise-tes-parents.github.io"
# Anti-abus : demandes par visiteur et par fenêtre, plafond global de réponses IA par jour
LIMITE_PAR_VISITEUR = "12"
FENETRE_MINUTES = "10"
PLAFOND_QUOTIDIEN = "300"

# Phase bêta : chaque question sans fiche devient une fiche sur mesure, sourcée, enregistrée dans la branche
# GitHub « fiches-ia » puis publiée dans la bibliothèque (marquée « créée par l'IA, non relue »).
# Exige le secret GITHUB_TOKEN (jeton GitHub limité à ce dépôt, droit « Contents : read and write »).
FICHES_IA = "1"
FICHES_IA_PAR_JOUR = "50"
GITHUB_REPO = "Gauchise-tes-parents/gauchise-tes-parents.github.io"
GITHUB_BRANCHE = "fiches-ia"

# Facultatif mais recommandé : un espace KV rend le plafond quotidien commun à toutes les instances.
# 1. npx wrangler kv namespace create GTP_KV   2. décommenter et coller l'identifiant obtenu :
# [[kv_namespaces]]
# binding = "GTP_KV"
# id = "COLLER_ICI_L_IDENTIFIANT"
