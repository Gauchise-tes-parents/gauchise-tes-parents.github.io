# Publication du site statique (mode autonome) sur GitHub Pages à chaque modification de la branche main.
name: Publier sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # phase bêta : publie régulièrement les fiches créées par l'IA (branche fiches-ia)
  schedule:
    - cron: '23 */2 * * *'
  workflow_run:
    workflows: ["Veille automatique"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # fiches créées par l'IA : ajoutées après les tests, revalidées une par une, marquées « non relue »
      - name: Intégrer les fiches IA (phase bêta)
        run: |
          if git fetch --depth=1 origin fiches-ia 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/propositions"
            git archive FETCH_HEAD data/propositions 2>/dev/null | tar -x -C "$RUNNER_TEMP/propositions" || true
            node scripts/integrer-fiches-ia.js "$RUNNER_TEMP/propositions"
          else
            echo "Pas encore de branche fiches-ia."
          fi
      - run: node scripts/build-static.js
        env:
          # URL https du serveur du mode connecté (facultatif ; vide = mode autonome seul)
          GTP_API_BASE: ${{ vars.GTP_API_BASE }}
          # URL https du backend IA Gemini (Cloudflare Worker), sans clé : variable de dépôt GTP_IA_BASE
          GTP_IA_BASE: ${{ vars.GTP_IA_BASE }}
          WATCH_EXTERNAL_SCHEDULE: ${{ vars.WATCH_EXTERNAL_SCHEDULE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
